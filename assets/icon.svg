<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Gargantuan</title>
  <defs>
    <!-- Doppler shift across the disk, as in the active window border: the
         side moving toward you is brighter and bluer, the other dimmer and redder. -->
    <linearGradient id="disk" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#729ef2" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#729ef2"/>
      <stop offset="0.36" stop-color="#fffaf2"/>
      <stop offset="0.56" stop-color="#f2a541"/>
      <stop offset="0.86" stop-color="#ec6464"/>
      <stop offset="1" stop-color="#ec6464" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f6d78f"/>
      <stop offset="0.5" stop-color="#f2a541"/>
      <stop offset="1" stop-color="#ec6464"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="#0a0d16" stroke="#2b3354"/>
  <!-- The far side of the disk, bent over and under the shadow. -->
  <circle cx="32" cy="32" r="13.5" fill="none" stroke="url(#arc)" stroke-width="3.5"/>
  <!-- The shadow and its photon ring. -->
  <circle cx="32" cy="32" r="10.5" fill="#03050a" stroke="#f6d78f" stroke-width="0.8"/>
  <!-- The near side of the disk, crossing in front. -->
  <ellipse cx="32" cy="33.5" rx="29" ry="2.6" fill="url(#disk)"/>
</svg>
